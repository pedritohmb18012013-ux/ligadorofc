<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ligar e Falar</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 0 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; }
    #msg { margin-top: 15px; }
  </style>
</head>
<body>
  <h1>📞 Ligar e Falar</h1>

  <label>Número (com DDI):</label>
  <input id="numero" type="tel" placeholder="+5512988428460">

  <label>Texto:</label>
  <textarea id="texto" rows="4" placeholder="Olá, teste de voz..."></textarea>

  <button onclick="ligar()">Ligar</button>
  <p id="msg"></p>

  <script>
    async function ligar() {
      const numero = document.getElementById('numero').value;
      const texto = document.getElementById('texto').value;
      const msg = document.getElementById('msg');

      if (!numero || !texto) { msg.textContent = 'Preencha tudo!'; return; }

      msg.textContent = 'Ligando...';

      const res = await fetch('/api/ligar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, texto })
      });

      const data = await res.json();
      msg.textContent = data.ok ? '✅ Chamada iniciada!' : '❌ ' + data.erro;
    }
  </script>
</body>
</html>
